[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "http://localhost:5000/api/:splat"
  status = 200

# NOTE: For production Netlify, you would typically use Netlify Functions 
# or a separate host for the Node.js server.
# If you use a separate host (e.g. Railway), change the 'to' URL above.
