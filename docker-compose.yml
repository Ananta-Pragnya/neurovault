version: "3.9"

# NeuroVault — docker-compose.yml
# Quick start: cp .env.example .env && docker compose up --build
#
# Services: postgres · redis · backend · frontend
# Network:  stocknet (bridge)

networks:
  stocknet:
    driver: bridge

volumes:
  pgdata:
  redis_data:

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-neurovault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurovault_pass}
      POSTGRES_DB:       ${POSTGRES_DB:-stocktracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neurovault}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [stocknet]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [stocknet]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-neurovault}:${POSTGRES_PASSWORD:-neurovault_pass}@postgres:5432/${POSTGRES_DB:-stocktracker}
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "pip install -r requirements.txt --quiet &&
             alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    networks: [stocknet]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    networks: [stocknet]
