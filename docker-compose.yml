# NeuroVault — docker-compose.yml
# Quick start: cp .env.example .env && docker compose up --build
#
# Services: postgres · redis · backend · frontend
# Network:  stocknet (bridge)

name: neurovault

networks:
  stocknet:
    driver: bridge

volumes:
  pgdata:
  redis_data:

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-neurovault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurovault_pass}
      POSTGRES_DB:       ${POSTGRES_DB:-stocktracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neurovault}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [stocknet]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [stocknet]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-neurovault}:${POSTGRES_PASSWORD:-neurovault_pass}@postgres:5432/${POSTGRES_DB:-stocktracker}
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    command: >
      sh -c "cd backend && alembic upgrade head && cd /app &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    networks: [stocknet]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        GEMINI_API_KEY: ${GEMINI_API_KEY:-}
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks: [stocknet]
